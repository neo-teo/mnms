<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M&amp;Ms — Critical Computation Lab</title>

  <!-- Link previews (Slack, iMessage, etc.). These can't come from data.json:
       preview bots read the HTML without running script.js -->
  <meta name="description" content="Critical Computation Lab, Section B — Parsons School of Design, Fall 2026. Taught by Teo Tsivranidis.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="M&amp;Ms — Critical Computation Lab">
  <meta property="og:description" content="Critical Computation Lab, Section B — Parsons School of Design, Fall 2026. Taught by Teo Tsivranidis.">
  <meta name="twitter:card" content="summary">
  <link rel="preload" href="fonts/ABCAreal-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Orange dot for link previews and bookmarks; shared.js recolors it to the theme -->
  <link rel="icon" id="favicon" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- In the head so dark mode is on before the page draws -->
  <script src="shared.js"></script>
</head>
<body>

  <!-- Top bar: students in random order + links -->
  <nav class="bar" id="bar"></nav>

  <main>
    <!-- Left: course info, description, school -->
    <section class="col-left">
      <div class="box" id="course"></div>
      <div class="description">
        <p id="description"></p>
        <p class="goals" id="goals"></p>
      </div>
      <a class="box" id="school" target="_blank"></a>
    </section>

    <!-- Middle: students + instructor -->
    <section class="col-middle">
      <ul class="students" id="students"></ul>
      <p class="instructor" id="instructor"></p>
    </section>

    <!-- Right: date, time, weather, lights, shuffle, M&M -->
    <section class="col-right">
      <div class="box now" id="now">
        <!-- "--" holds each line's space until the clock and weather load -->
        <p id="date">--</p>
        <p id="time">--</p>
        <p id="place">--</p>
        <p id="weather">--</p>
        <p id="temp">--</p>
      </div>
      <button class="box button" id="lights" aria-pressed="false">Lights</button>
      <button class="box button" id="shuffle">Shuffle</button>
      <canvas class="mnm" id="mnm" role="img" aria-label="An M&amp;M character"></canvas>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
