<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M&amp;Ms — Critical Computation Lab</title>
  <link rel="preload" href="fonts/ABCAreal-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" id="favicon">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar: students in random order + links -->
  <nav class="bar" id="bar"></nav>

  <main>
    <!-- Left: course info, description, school -->
    <section class="col-left">
      <div class="box" id="course"></div>
      <div class="description">
        <p id="description"></p>
        <p class="goals" id="goals"></p>
      </div>
      <a class="box" id="school" target="_blank"></a>
    </section>

    <!-- Middle: students + instructor -->
    <section class="col-middle">
      <ul class="students" id="students"></ul>
      <p class="instructor" id="instructor"></p>
    </section>

    <!-- Right: date, time, weather -->
    <section class="col-right">
      <div class="box now">
        <!-- "--" holds each line's space until the clock and weather load -->
        <p id="date">--</p>
        <p id="time">--</p>
        <p id="place">--</p>
        <p id="weather">--</p>
        <p id="temp">--</p>
      </div>
      <button class="box shuffle" id="shuffle">Shuffle</button>
      <canvas class="mnm" id="mnm" role="img" aria-label="An M&amp;M character"></canvas>
    </section>
  </main>

  <!-- Full-screen color flash shown while shuffling -->
  <div class="flash" id="flash" hidden></div>

  <script src="script.js"></script>
</body>
</html>
